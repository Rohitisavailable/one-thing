services:
  - type: web
    runtime: static
    name: one-thing
    buildCommand: node scripts/generate-config.mjs
    staticPublishPath: public
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
